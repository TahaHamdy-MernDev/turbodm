[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turbodm"
version = "1.0.0"
description = "TurboDM - High-speed native Linux download manager inspired by IDM for Fedora GNOME"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx[http2,socks]>=0.27.0",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
turbodm = "turbodm.app:main"
turbodm-native-host = "turbodm.ipc.native_host:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turbodm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
