name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-tests:
    name: Python, GTK4 & Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GTK4, Libadwaita, Cairo & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            xvfb

      - name: Set up Python virtualenv with system GTK4 bindings
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run pytest suite
        run: xvfb-run -a .venv/bin/pytest -v

      - name: Validate Chrome & Firefox extension JavaScript syntax
        run: |
          for js in extensions/chrome/*.js extensions/firefox/*.js; do
            node --check "$js"
          done

  website-build:
    name: Astro Landing Page Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
